server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      mvc:
        routes:
          - id: auth-service
            uri: http://localhost:8081
            predicates:
              - Path=/api/auth/**
          - id: course-service
            uri: http://localhost:8082
            predicates:
              - Path=/api/courses/**
          - id: lesson-service
            uri: http://localhost:8083
            predicates:
              - Path=/api/lessons/**
          - id: enrollment-service
            uri: http://localhost:8084
            predicates:
              - Path=/api/enrollments/**
          - id: assessment-quiz
            uri: http://localhost:8085
            predicates:
              - Path=/api/quizzes/**
          - id: assessment-attempt
            uri: http://localhost:8085
            predicates:
              - Path=/api/attempts/**
          - id: payment-service
            uri: http://localhost:8086
            predicates:
              - Path=/api/payments/**
          - id: progress-service
            uri: http://localhost:8087
            predicates:
              - Path=/api/progress/**
          - id: discussion-service
            uri: http://localhost:8088
            predicates:
              - Path=/api/discussions/**
          - id: notification-service
            uri: http://localhost:8089
            predicates:
              - Path=/api/notifications/**

logging:
  level:
    org.springframework.cloud.gateway: DEBUG